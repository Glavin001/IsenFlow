<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsenFlow Demos</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1220; color: #cfd8e6; font-family: ui-monospace, monospace; }
      #app { position: fixed; inset: 0; }
      #ui {
        position: fixed; top: 12px; left: 12px; padding: 10px 14px;
        background: rgba(15, 24, 40, 0.85); border-radius: 8px;
        max-width: 320px; line-height: 1.4; font-size: 13px;
      }
      #ui h1 { font-size: 14px; margin: 0 0 6px; color: #7fbeff; }
      #ui select, #ui button { width: 100%; padding: 6px; margin-top: 6px; background: #1a2438; color: #cfd8e6; border: 1px solid #2a3a5a; border-radius: 4px; font-family: inherit; }
      #ui small { color: #8a9bb6; }
      #hud { position: fixed; top: 12px; right: 12px; padding: 8px 12px; background: rgba(15, 24, 40, 0.85); border-radius: 6px; font-variant-numeric: tabular-nums; min-width: 220px; font-size: 12px; line-height: 1.5; }
      #hud .row { display: flex; justify-content: space-between; gap: 12px; }
      #hud .label { color: #8a9bb6; }
      #hud .val { color: #cfd8e6; }
      #hud hr { border: none; border-top: 1px solid #2a3a5a; margin: 6px 0; }
      #hud .ctrl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      #hud input[type=range] { flex: 1; }
      #err { position: fixed; bottom: 12px; left: 12px; right: 12px; padding: 12px; background: #4a1a1a; color: #ffcccc; border-radius: 6px; display: none; white-space: pre-wrap; font-size: 12px; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <h1>IsenFlow Demos</h1>
      <small>Real-time SWE water on WebGPU</small>
      <select id="demoSelect"></select>
      <small id="demoDescription"></small>
    </div>
    <div id="hud">
      <div class="row"><span class="label">Render</span><span class="val"><span id="hud-fps">--</span> fps · <span id="hud-frame-ms">--</span> ms</span></div>
      <div class="row"><span class="label">Sim step</span><span class="val"><span id="hud-sim-ms">--</span> ms · <span id="hud-substeps">--</span>×</span></div>
      <div class="row"><span class="label">Sim Hz</span><span class="val"><span id="hud-sim-hz">--</span> Hz</span></div>
      <div class="row"><span class="label">Sim rate</span><span class="val"><span id="hud-sim-rate">--</span>× real</span></div>
      <hr />
      <div class="row"><span class="label">Grid</span><span class="val" id="hud-grid">--</span></div>
      <div class="row"><span class="label">GPU</span><span class="val" id="hud-gpu" title="">--</span></div>
      <div class="ctrl">
        <span class="label">Speed</span>
        <input id="hud-speed" type="range" min="0.25" max="8" step="0.25" value="1" />
        <span class="val" id="hud-speed-val">1.0×</span>
      </div>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
