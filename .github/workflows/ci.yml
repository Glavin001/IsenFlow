name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter isenflow test:unit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  build:
    name: Build (library + demos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter isenflow build
      - run: pnpm --filter demos build
      - uses: actions/upload-artifact@v4
        with:
          name: demos-dist
          path: apps/demos/dist
          if-no-files-found: error

  e2e:
    name: Playwright (WebGPU via SwiftShader)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Mesa Vulkan / Lavapipe for software WebGPU
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools libnss3 libxss1 libasound2t64 || \
            sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools libnss3 libxss1 libasound2
          vulkaninfo --summary || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter isenflow build
      - run: pnpm --filter demos build
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demos
      - name: Print Chromium + WebGPU diagnostics
        run: |
          which chromium 2>/dev/null || true
          ls /opt/pw-browsers/ 2>/dev/null || true
          /opt/pw-browsers/chromium-*/chrome-linux/chrome --version 2>/dev/null || true
      - run: pnpm --filter demos test:e2e
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/demos/playwright-report
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/demos/test-results
          if-no-files-found: ignore
